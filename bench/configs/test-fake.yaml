# Thử harness ở LOCAL với server giả (bench/fake_server.py), không cần GPU. Dùng trong bench/test_fake.sh.
# Sức chứa K của server giả lấy từ biến môi trường FAKE_K (điểm gãy biết trước = K).
mode: search
repeats: 1
seed_base: 1000
num_requests: {min: 100, per_user: 4}
slo: {ttft_ms: 300, tpot_ms: 50}       # server giả: quá sức chứa → TTFT +500 ms
slo2: {ttft_ms: 100, tpot_ms: 20}
verdict_window: all
search: {grid: [8, 16, 32, 64], min_n: 2, max_n: 1024, abs_tol: 2, rel_tol: 0.10}
workloads:
  w1: {path: data/workloads/w1.jsonl}
server:
  start: "bash bench/fake_serve.sh {log} --mode threshold --capacity $FAKE_K --token-s 0.0005 --chunk-tokens 50"
  stop: "bash bench/fake_serve.sh --stop"
  base_url: http://localhost:8123
  model: Qwen/Qwen3-30B-A3B-GPTQ-Int4
  restart: per_repeat_grid
client:
  vllm_cmd: "env VLLM_TARGET_DEVICE=cpu /home/thienta/.local/share/vllm-bench-venv/bin/vllm bench serve"
  tokenizer: data/raw/qwen3-tokenizer
  sampling: {temperature: 0, ignore_eos: true}
warmup: {requests: 4, max_tokens: 16}
software: {server: fake}
unit_timeout_s: 600
unit_overhead_s: 8
