# P03 — kiểm tra rút gọn trên L4 (vLLM 0.30.0 mặc định + --max-model-len 16384).
# Chạy trên máy thuê, trong thư mục repo:  /root/venv/bin/python bench/sweep.py --config bench/configs/smoke.yaml --out ...
# - W2 / 16 user × 3 lần bằng vllm bench serve + × 3 lần bằng client tự viết (session_client closed) → nhiễu + kiểm chứng client.
# - Khởi động lại server giữa các lần lặp (per_repeat) → 3 lần khởi động, ghi KV cache mỗi lần (giả thuyết P01:
#   lần đầu compile từ đầu cho KV nhỏ hơn) và gộp nhiễu do khởi động lại vào độ lệch W2/16.
mode: grid
repeats: 1
seed_base: 1000
num_requests: {min: 100, per_user: 4}
slo: {ttft_ms: 10000, tpot_ms: 150}
slo2: {ttft_ms: 2000, tpot_ms: 100}
verdict_window: all
points:
  - {w: w2, n: 16, repeats: 3}
  - {w: w2, n: 16, repeats: 3, client: session}
  - {w: w2, n: 8}
  - {w: w2, n: 32}
  - {w: w1, n: 16}
  - {w: w3, n: 8}
workloads:
  w1: {path: data/workloads/w1.jsonl}
  w2: {path: data/workloads/w2.jsonl}
  w3: {path: data/workloads/w3.jsonl}
server:
  start: "bash scripts/serve_default.sh {log} --max-model-len 16384"
  stop: "bash scripts/stop_server.sh"
  base_url: http://localhost:8000
  model: Qwen/Qwen3-30B-A3B-GPTQ-Int4
  recompile_restart_s: 10     # compile từ đầu → KV nhỏ hơn (P03) → bật lại trước khi đo
  restart: per_repeat
client:
  vllm_cmd: "/root/venv/bin/vllm bench serve"
  python: /root/venv/bin/python
  tokenizer: /root/models/Qwen3-30B-A3B-GPTQ-Int4
  sampling: {temperature: 0, ignore_eos: true}
warmup: {requests: 4, max_tokens: 16}
software:
  vllm: 0.30.0
  torch: 2.13.0+cu130
  model: Qwen/Qwen3-30B-A3B-GPTQ-Int4@9b534e4318b7ebc3c961a839f13eb18b1833f441
  image: nvidia/cuda:13.0.2-devel-ubuntu22.04
  env: VLLM_SERVER_DEV_MODE=1
unit_timeout_s: 3600
unit_overhead_s: 25
price_usd_per_h: 0.30
